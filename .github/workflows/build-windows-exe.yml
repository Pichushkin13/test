name: Build Windows Calculator EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build GUI EXE (onefile)
        run: pyinstaller --windowed --onefile --name BeautifulCalculator calculator_gui.py

      - name: Build GUI EXE (onedir fallback)
        run: pyinstaller --windowed --onedir --name BeautifulCalculator_portable calculator_gui.py

      - name: Archive onedir build
        shell: pwsh
        run: Compress-Archive -Path dist/BeautifulCalculator_portable/* -DestinationPath dist/BeautifulCalculator_portable.zip

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BeautifulCalculator-builds
          path: |
            dist/BeautifulCalculator.exe
            dist/BeautifulCalculator_portable.zip
