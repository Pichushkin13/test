name: Build Windows Calculator EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build GUI EXE
        run: pyinstaller --windowed --onefile --name BeautifulCalculator calculator_gui.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeautifulCalculator-exe
          path: dist/BeautifulCalculator.exe
