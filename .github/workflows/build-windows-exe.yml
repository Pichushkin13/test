name: Build Windows Calculator EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/BeautifulCalculator.csproj

      - name: Publish self-contained EXE
        run: dotnet publish src/BeautifulCalculator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeautifulCalculator-exe
          path: dist/BeautifulCalculator.exe
